<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Master Settings Login - VPL Exhibition</title>
<style>
  :root{
    --navy:#0f2136;
    --navy-card:#16293f;
    --navy-input:#1d3450;
    --teal:#0e7c7b;
    --teal-light:#15a3a1;
    --line:#2a4059;
    --ink:#e8edf2;
    --muted:#8ea3b8;
    --danger:#ff8a80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 30% 20%, #17304a 0%, var(--navy) 55%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:400px;
    background:var(--navy-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 30px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .logo-badge{
    width:64px;height:64px;
    background:#fff;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    font-weight:800;
    font-size:1.15rem;
    color:var(--navy);
    letter-spacing:.02em;
  }
  h1{
    text-align:center;
    font-size:1.2rem;
    font-weight:700;
    margin:0 0 4px;
    color:#fff;
  }
  .subtitle{
    text-align:center;
    font-size:.72rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--teal-light);
    font-weight:700;
    margin:0 0 26px;
  }
  h2{
    font-size:1.3rem;
    font-weight:700;
    margin:0 0 4px;
    color:#fff;
  }
  .welcome-sub{
    font-size:.85rem;
    color:var(--muted);
    margin:0 0 24px;
  }
  label{
    display:block;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--teal-light);
    margin-bottom:8px;
  }
  .field{margin-bottom:18px;}
  input[type=text], input[type=password]{
    width:100%;
    padding:13px 14px;
    font-size:16px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:var(--navy-input);
    color:var(--ink);
    font-family:inherit;
    min-height:48px;
  }
  input::placeholder{color:#5c7690;}
  input:focus{outline:none;border-color:var(--teal-light);box-shadow:0 0 0 3px rgba(21,163,161,.25);}
  .signin-btn{
    width:100%;
    margin-top:6px;
    padding:15px 10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--teal-light), var(--teal));
    color:#fff;
    font-size:.98rem;
    font-weight:700;
    cursor:pointer;
    min-height:50px;
  }
  .signin-btn:active{opacity:.9;}
  .error-msg{
    background:rgba(255,138,128,.12);
    border:1px solid rgba(255,138,128,.35);
    color:var(--danger);
    font-size:.82rem;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:18px;
    text-align:center;
  }
  .footer-note{
    text-align:center;
    font-size:.72rem;
    color:var(--muted);
    margin-top:22px;
  }
  .back-link{
    display:block;
    text-align:center;
    margin-top:14px;
    font-size:.82rem;
    color:var(--teal-light);
    text-decoration:none;
  }
  .back-link:hover{text-decoration:underline;}
</style>
</head>
<body>

  <div class="login-card">
    <div class="logo-badge">VPL</div>
    <h1>VPL Customer Enquiry Form</h1>
    <p class="subtitle">Master Settings — Admin Login</p>

    <h2>Welcome Back</h2>
    <p class="welcome-sub">Sign in to manage dropdown options and account settings</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" autofocus autocomplete="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" autocomplete="off">
      </div>
      <button type="submit" class="signin-btn">Sign In &rarr;</button>
    </form>

    <a class="back-link" href="{{ url_for('index') }}">&larr; Back to the exhibition form</a>
    <p class="footer-note">VPL Exhibition Form &middot; Vijayshri Packaging Ltd.</p>
  </div>

</body>
</html>
